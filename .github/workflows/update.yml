name: Refresh desks and front page

# GitHub's scheduler is best-effort: runs can start late or, rarely, be skipped (the 08:00 IST run of 20 Sep 2026 never
# started). So the morning build is scheduled three times; repeating it is safe because the collectors only add what is new.
# Times below are UTC.
#   23:47 UTC = 05:17 IST   00:07 UTC = 05:37 IST   00:37 UTC = 06:07 IST   -> Front Page ready by about 6 AM IST
# PIB lists only the current day's releases, so an afternoon and an evening run also collect it before it rolls over.
on:
  schedule:
    - cron: "47 23 * * *"
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
    - cron: "37 10 * * *"   # 16:07 IST
    - cron: "37 16 * * *"   # 22:07 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect new policy items
        run: python scripts/fetch_policies.py
      - name: Collect startup stories
        run: python scripts/fetch_startups.py
      - name: Collect immigration news
        run: python scripts/fetch_immigration.py
      - name: Build the Front Page
        run: python scripts/build_front_page.py
      - name: Write briefs for stories that have none (front page stories first)
        run: python scripts/brief.py --budget 150
        env:
          # Optional: add BRIEF_LLM_KEY as a repository secret to switch the briefs to an AI model (see scripts/brief.py).
          BRIEF_LLM_KEY: ${{ secrets.BRIEF_LLM_KEY }}
          BRIEF_LLM_PROVIDER: ${{ vars.BRIEF_LLM_PROVIDER }}
          BRIEF_LLM_MODEL: ${{ vars.BRIEF_LLM_MODEL }}
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "updates-for-pal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Refresh $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase -X theirs || true
            git push
          else
            echo "No changes"
          fi
