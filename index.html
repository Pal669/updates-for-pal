<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates for Pal</title>
<meta name="description" content="A personal newspaper. Policy, Startup, Migration, Investment Advisory and Listed Market Universe desks, each item linked to its original source.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css?v=20260927">
</head>
<body>
<header class="masthead">
  <div class="dateline"><span id="today"></span><span id="edition"></span></div>
  <h1>Updates for Pal</h1>
  <p class="tagline">What changed, who changed it, and where to read the original</p>
  <nav class="desks" aria-label="Desks">
    <a class="desk" data-desk="top" href="#top">Front Page</a>
    <a class="desk" data-desk="advisory" href="#advisory">Investment Advisory Universe</a>
    <a class="desk" data-desk="policy" href="#policy">Policy Desk</a>
    <a class="desk" data-desk="startups" href="#startups">Startup Desk</a>
    <a class="desk" data-desk="immigration" href="#immigration">Migration Desk</a>
    <a class="desk" data-desk="listed" href="#listed">Listed Universe</a>
  </nav>
  <nav id="subs" class="subs" aria-label="Sections" hidden></nav>
</header>

<main>
  <section id="lead" class="lead" hidden></section>
  <section id="numbers" class="numbers" hidden></section>

  <section class="controls" aria-label="Filters">
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <div class="row"><div id="f1" class="chips" role="group" aria-label="Sector"></div></div>
    <div class="row"><div id="f2" class="chips" role="group" aria-label="Type or source"></div></div>
    <div class="row split">
      <div id="f3" class="chips" role="group" aria-label="Source"></div>
      <label class="toggle"><input id="flag" type="checkbox"> <span id="flagLabel"></span></label>
    </div>
    <p id="count" class="count"></p>
  </section>

  <section id="feed" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>Nothing matches. Clear a filter or change the search.</p>
</main>

<footer>
  <p id="sources"></p>
  <p id="updated"></p>
</footer>
<script src="app.js?v=20260927"></script>
</body>
</html>
